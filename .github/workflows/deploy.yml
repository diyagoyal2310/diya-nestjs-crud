name: Deploy to EC2

on:
  push:
    branches:
      - new-setup

permissions:
  contents: read

concurrency:
  group: nestjs-production-deployment
  cancel-in-progress: false

env:
  EC2_USER: ubuntu
  EC2_HOST: ${{ secrets.EC2_HOST }}

jobs:
  deploy:
    name: Deploy existing EC2 instance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.EC2_SSH_KEY }}' > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -T 10 -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/ec2_key \
            "$EC2_USER@$EC2_HOST" \
            'sudo bash /home/ubuntu/diya-nestjs-crud/scripts/deploy-on-ec2.sh'
