name: Deploy to EC2

on:
  push:
    branches:
      - new-setup

permissions:
  id-token: write
  contents: read

concurrency:
  group: nestjs-production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::023133287482:role/github-actions-nestjs-deploy-role
  EC2_INSTANCE_ID: i-0bcc63672446eebb8

jobs:
  deploy:
    name: Deploy existing EC2 instance
    runs-on: ubuntu-latest

    steps:
      - name: Check GitHub context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Workflow ref: $GITHUB_WORKFLOW_REF"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy through AWS Systems Manager
        shell: bash
        run: |
          set -euo pipefail

          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy diya-nestjs-crud from new-setup (${GITHUB_SHA})" \
            --parameters 'commands=["bash /home/ubuntu/diya-nestjs-crud/scripts/deploy-on-ec2.sh"]' \
            --query 'Command.CommandId' \
            --output text)"

          echo "Sent SSM deployment command: $command_id"
          echo "Target instance: $EC2_INSTANCE_ID"

          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,StatusDetails:StatusDetails,ResponseCode:ResponseCode,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}' \
            --output json
